<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" href="{{ url_for('static', filename='img/login/logo.png') }}" type="image/png" />
    <title>Login - Larlocker</title>
  </head>
  <body>
    <img src="{{ url_for('static', filename='img/login/larlocker.png') }}" alt="Logo" />

    {% with messages=get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-container">
          {% for category, message in messages %}
            <div class="flash-message {{ category }}">
              <span class="flash-icon">⚠️</span> <!-- Ícone de alerta -->
              {{ message }}
            </div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}
    <form action="{{ url_for('login') }}" method="post">
      <label>Email:</label>
      <input type="email" name="email" placeholder="@gmail.com" required />
      <br />
      <label>Senha:</label>
      <input type="password" name="password" placeholder="Sua senha" required />
      <br /><input id="enviar" type="submit" value="Entrar" />
      <br /><a href="{{ url_for('recuperar_senha') }}">Esqueceu sua senha?</a>
      <br /><section>
        Não tem uma conta? <a href="{{ url_for('cadastro') }}">Inscreva-se</a>
      </section>
      <p id="error-message" class="error"></p>
    </form>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

  </body>
</html>
