<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trocar Senha - Larlocker</title>
    <link rel="icon" href="{{ url_for('static', filename='img/logo.png') }}" type="image/png" />
  </head>
  <body>
    <img src="{{ url_for('static', filename='img/larlocker.png') }}" alt="Logo" />
    <h2>Trocar Senha</h2>
    <form id="trocarSenhaForm" onsubmit="event.preventDefault(); update_senha();">
      <label>Email:</label>
      <input id="email" type="email" name="email" placeholder="Digite seu email" required />
      <br />
      <label>Nova Senha:</label>
      <input id="senha" type="password" name="password" placeholder="Digite a senha" required />
      <br />
      <label>Confirme Sua Nova Senha:</label>
      <input id="confirmSenha" type="password" name="confirm_password" placeholder="Confirme a senha" required />
      <br />
      <button id="enviar" type="submit">Confirmar</button>
    </form>
    <script src="{{ url_for('static', filename='js/script_trocar_senha.js') }}"></script>
  </body>
</html>
