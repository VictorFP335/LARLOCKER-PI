<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio</title>
    <link rel="icon" href="{{ url_for('static', filename='img/logo.png') }}" type="image/png">
</head>
<body>
    <aside>
        <ul>
            <li> <a href="{{ url_for('inicio') }}"> <img src="{{ url_for('static', filename='img/home.png') }}" width="40px" height="40px"><br>Início</a> </li>
            <li> <a href="#"> <img src="{{ url_for('static', filename='img/lupa.png') }}" width="40px" height="40px"><br>Procurar</a> </li>
            <li> <a href="{{ url_for('inicio') }}"> <img src="{{ url_for('static', filename='img/carrinho.png') }}" width="40px" height="40px"><br>Lista de compras</a> </li>
            <li> <a href="#"> <img src="{{ url_for('static', filename='img/lupa.png') }}" width="40px" height="40px"><br>Modo claro</a> </li>
            <li> <a href="#"> <img src="{{ url_for('static', filename='img/perfil.png') }}" width="40px" height="40px"><br>Conta</a> </li>
            <li> <a href="#"> <img src="{{ url_for('static', filename='img/ajuda.png') }}" width="40px" height="40px"><br>Ajuda</a> </li>
            <li> <a href="#"> <img src="{{ url_for('static', filename='img/sair.png') }}" width="40px" height="40px"><br>Sair</a> </li>
        </ul>
    </aside>

    <main>
        <img src="{{ url_for('static', filename='img/larlocker.png') }}" width="60%"><br>
        <h1>Listas de compras</h1>
        <section id="comodoContainer">
            <!-- Os cômodos são adicionados aqui pelo JavaScript -->
        </section>

        <button onclick="showAddRoomForm()">Adicionar Lista de Compra</button>

        <div id="modalRoom" class="modal">
            <div class="modal-content">
                <span class="close" onclick="cancelAddRoom()">&times;</span>
                <h2>Adicionar Nova Lista de Compra</h2>
                <input type="text" id="nomeComodo" placeholder="Nome da lista" required>
                <br><br>
                <button onclick="submitNewRoom()">Adicionar</button>
            </div>
        </div>
    </main>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
