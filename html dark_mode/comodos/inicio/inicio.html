    <main>
        <img src="../../img/larlocker.png" width="60%"><br>
        <h1>Cômodos</h1>
        <section id="comodoContainer">
            <!-- Os cômodos são adicionados aqui -->
        </section>

        <button onclick="showAddRoomForm()">Adicionar Cômodo</button>

        <div id="editModal" class="modal">
            <div class="modal-content">
                <span class="close" onclick="closeEditModal()">&times;</span>
                <h2>Editar Nome do Cômodo</h2>
                <input type="text" id="editNomeComodo" placeholder="Novo nome do cômodo" required>
                <br><br>
                <button onclick="submitEdit()">Salvar</button>
            </div>
        </div>
        <div id="modalRoom" class="modal">
            <div class="modal-content">
                <span class="close" onclick="cancelAddRoom()">&times;</span>
                <h2>Adicionar Novo Cômodo</h2>
                <input type="text" id="nomeComodo" placeholder="Nome do cômodo" required>
                <br><br>
                <button onclick="submitNewRoom()">Adicionar</button>
            </div>
        </div>

    </main>
    <script src="script.js"></script>
</body>

</html>
